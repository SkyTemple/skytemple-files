[tox]
envlist = py311,py312,py313,py314
skipsdist=True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv =
    SKYTEMPLE_USE_NATIVE={env:SKYTEMPLE_USE_NATIVE:0}
    SKYTEMPLE_TEST_ROM={env:SKYTEMPLE_TEST_ROM:}
commands =
  pytest -n 3 --junitxml pytest.xml -W ignore::DeprecationWarning {posargs}
deps =
  -r requirements.txt
  pytest-xdist
